global:
  scrape_interval: 5s      # demo-scale; production would use 15-60s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pulseops-api
    metrics_path: /metrics
    static_configs:
      - targets: ["pulseops-api:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
